version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: compliance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compliance}
      POSTGRES_USER: ${POSTGRES_USER:-compliance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compliance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance} -d ${POSTGRES_DB:-compliance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: compliance_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  compliance_api:
    build:
      context: ..
      dockerfile: backend/fastapi_services/compliance_api/Dockerfile
    container_name: compliance_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://compliance:compliance@postgres:5432/compliance}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/web/Dockerfile
    container_name: compliance_web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - compliance_api

  django:
    image: python:3.11-slim
    container_name: compliance_django
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "python -m http.server 8080"
    ports:
      - "${DJANGO_PORT:-8080}:8080"
    restart: unless-stopped

  celery_worker:
    image: python:3.11-slim
    container_name: compliance_celery_worker
    working_dir: /app
    volumes:
      - ..:/app
    env_file:
      - ../.env
    command: sh -c "python -c 'import time; print(\"celery worker placeholder running\"); time.sleep(10**6)'"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    image: python:3.11-slim
    container_name: compliance_celery_beat
    working_dir: /app
    volumes:
      - ..:/app
    env_file:
      - ../.env
    command: sh -c "python -c 'import time; print(\"celery beat placeholder running\"); time.sleep(10**6)'"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
