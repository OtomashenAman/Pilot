version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: compliance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compliance}
      POSTGRES_USER: ${POSTGRES_USER:-compliance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compliance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: compliance_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  compliance_api:
    build:
      context: ..
      dockerfile: backend/fastapi_services/compliance_api/Dockerfile
    container_name: compliance_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compliance}:${POSTGRES_PASSWORD:-compliance}@db:5432/${POSTGRES_DB:-compliance}
      REDIS_URL: redis://redis:6379/0
      PORT: ${API_PORT:-8000}
    depends_on:
      - db
      - redis
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ..
      dockerfile: frontend/web/Dockerfile
    container_name: compliance_web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      PORT: ${WEB_PORT:-3000}
    depends_on:
      - compliance_api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
