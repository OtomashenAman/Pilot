version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compliance
    ports:
      - "5432:5432"

  compliance-engine:
    build:
      context: ../services/compliance-engine
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/compliance
    depends_on:
      - db
    ports:
      - "8000:8000"
